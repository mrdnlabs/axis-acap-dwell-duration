# Test-only Mosquitto config for verifying the MQTT plumbing (IF-2).
#
# Anonymous access on the plain 1883 listener. This is a LAB FIXTURE for
# checking topic strings and payloads on a trusted local network — it is not a
# production broker configuration and must not be used as one.

listener 1883 0.0.0.0
allow_anonymous true

# Log every publish so resolved topic strings can be diffed against what the
# app's UI offers for copy (the IF-2 topic verification step).
log_type all
log_timestamp true
connection_messages true
